version: '3.8'

services:
  web:
    build: .
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - APP_URL=${APP_URL:-http://localhost:10000}
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
